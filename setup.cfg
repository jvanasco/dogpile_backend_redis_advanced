[metadata]
name = dogpile_backend_redis_advanced
version = attr: dogpile_backend_redis_advanced.__version__
description = Advanced Redis plugins for `dogpile.cache`.
long_description = file: README.md
long_description_content_type = text/markdown
classifiers =
    Development Status :: 5 - Production/Stable
    Intended Audience :: Developers
    Programming Language :: Python
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Programming Language :: Python :: 3.14
    Programming Language :: Python :: 3.15
keywords = caching, dogpile
author = Jonathan Vanasco
author_email = jvanasco@2xlp.com
url = https://github.com/jvanasco/dogpile_backend_redis_advanced
license = MIT

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.10
include_package_data = True
zip_safe = False
install_requires =
    dogpile.cache>=1.5.0
    redis

[options.packages.find]
where = src

[options.package_data]
dogpile_backend_redis_advanced = py.typed

[options.extras_require]
valkey =
    valkey
testing =
    flake8
    mypy
    pytest
    pytest-cov
    mock
    msgpack>=1.1.2
    msgpack-types
    tox>=4
    types-mock
    typing-extensions

[tox:tox]
requires = tox>=4
env_list = py310, py311, py312, py313, py314, py315

[testenv]
extras = testing, valkey
pass_env = DOGPILE_REDIS_PORT, DOGPILE_VALKEY_PORT
commands =
    python -m pytest --cov=dogpile_backend_redis_advanced --cov-report=term --cov-report=html:.tox/{env_name}/htmlcov {posargs}

[testenv:lint]
skip_install = True
extras =
deps = flake8
commands = python -m flake8 {posargs:src tests}

[testenv:mypy]
commands = python -m mypy {posargs:src tests}

[flake8]
max-line-length = 88
exclude = docs/*, .eggs/*, .pytest_cache/*, .tox/*, build/*, dist/*
per-file-ignores:
    src/dogpile_backend_redis_advanced/cache/backends/redis_advanced.py: E501
    tests/*:
        E501
        E731
        E741
        F841
application_import_names = dogpile_backend_redis_advanced
import_order_style = appnexus
