name: Python package

on:
  push:
    branches: [main, "workflow_test_*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    name: Redis and Valkey tests on Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            toxenv: py310
          - python: "3.11"
            toxenv: py311
          - python: "3.12"
            toxenv: py312
          - python: "3.13"
            toxenv: py313
          - python: "3.14"
            toxenv: py314
          - python: "3.15"
            toxenv: py315
    services:
      redis:
        image: redis:8
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
      valkey:
        image: valkey/valkey:9.1.2
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6380:6379
    env:
      DOGPILE_REDIS_PORT: "6379"
      DOGPILE_VALKEY_PORT: "6380"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - name: Install tox
        run: python -m pip install "tox>=4"
      - name: Run tests
        run: python -m tox -e ${{ matrix.toxenv }}
      - name: Upload HTML coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.toxenv }}
          path: .tox/${{ matrix.toxenv }}/htmlcov/
